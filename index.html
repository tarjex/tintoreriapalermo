<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tintoreria-Palermo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#2447e0;
    --azul-suave:#dfe5fb;
    --texto:#1a2142;
    --texto-suave:#5d6587;
    --fondo:#eef1f8;
    --card:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{
    font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    background:var(--fondo);
    color:var(--texto);
    display:flex;justify-content:center;
  }
  .pagina{
    width:100%;max-width:440px;min-height:100vh;
    background:var(--card);
    display:flex;flex-direction:column;
    box-shadow:0 0 40px rgba(26,33,66,.08);
  }

  /* Portada + logo */
  .portada{
    height:170px;
    background:#2a2522 center/cover no-repeat;
    position:relative;
  }
  .portada::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(to bottom,rgba(0,0,0,.15),rgba(0,0,0,0) 40%,rgba(255,255,255,0) 70%,rgba(255,255,255,.35));
  }
  .logo{
    width:108px;height:108px;border-radius:50%;
    margin:-54px auto 0;position:relative;z-index:2;
    border:4px solid #fff;
    background:#111 center/cover no-repeat;
    box-shadow:0 6px 18px rgba(26,33,66,.22);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:20px;
  }

  /* Contenido */
  .contenido{padding:18px 22px 26px;text-align:center;flex:1;display:flex;flex-direction:column}
  h1{font-size:23px;font-weight:800;letter-spacing:-.3px;margin-top:6px}
  .mensaje{margin-top:10px;font-size:15px;line-height:1.5;color:var(--texto-suave);font-weight:500}
  .divisor{
    display:flex;align-items:center;gap:10px;margin:14px auto 18px;width:70%;
    color:var(--azul);
  }
  .divisor::before,.divisor::after{content:"";flex:1;height:1px;background:var(--azul-suave)}
  .divisor svg{width:20px;height:20px}

  /* Botón principal */
  .principal{
    display:flex;align-items:center;justify-content:center;gap:12px;
    background:var(--azul);color:#fff;text-decoration:none;
    font-weight:700;font-size:16.5px;
    padding:16px 18px;border-radius:14px;
    box-shadow:0 8px 20px rgba(36,71,224,.28);
    transition:transform .15s ease;
  }
  .principal:active{transform:scale(.98)}
  .principal .ico{
    width:34px;height:34px;border-radius:50%;background:#fff;
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .principal .ico svg{width:20px;height:20px}

  /* Grilla */
  .grilla{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:14px}
  .grilla .tile{grid-column:span 2}
  .grilla .tile:nth-child(n+4){grid-column:span 3}
  .tile{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    min-height:112px;padding:14px 6px;
    background:#fff;border:1.5px solid var(--azul-suave);border-radius:14px;
    text-decoration:none;color:var(--texto);
    font-weight:700;font-size:13.5px;line-height:1.2;
    box-shadow:0 4px 12px rgba(36,71,224,.06);
    transition:transform .15s ease,border-color .15s ease;
  }
  .tile:active{transform:scale(.97);border-color:var(--azul)}
  .tile svg{width:32px;height:32px;color:var(--azul)}

  /* Redes */
  .redes{display:flex;justify-content:center;gap:26px;margin-top:26px}
  .redes a{
    width:44px;height:44px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    text-decoration:none;
    transition:transform .15s ease;
  }
  .redes a:active{transform:scale(.92)}
  .redes svg{width:100%;height:100%}

  /* Pie */
  .pie{margin-top:auto;padding-top:22px;font-size:12.5px;color:#9aa0b8;font-weight:500}
  .pie b{color:var(--texto-suave);font-weight:700}

  button.tile{font-family:inherit;cursor:pointer}

  /* Ventana de horarios */
  .overlay{
    position:fixed;inset:0;z-index:50;
    background:rgba(20,26,52,.55);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;padding:20px;
    opacity:0;visibility:hidden;transition:opacity .2s ease,visibility .2s;
  }
  .overlay.abierto{opacity:1;visibility:visible}
  .modal{
    width:100%;max-width:380px;background:#fff;border-radius:20px;
    padding:24px 22px 22px;position:relative;
    box-shadow:0 20px 50px rgba(0,0,0,.3);
    transform:translateY(14px) scale(.97);transition:transform .2s ease;
  }
  .overlay.abierto .modal{transform:none}
  .modal h2{font-size:19px;font-weight:800;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}
  .modal h2 svg{width:22px;height:22px;color:var(--azul)}
  .cerrar{
    position:absolute;top:10px;right:10px;width:34px;height:34px;border:0;border-radius:50%;
    background:#f1f3fa;color:var(--texto-suave);font-size:20px;line-height:1;cursor:pointer;
  }
  .lista-horarios{list-style:none;margin-top:16px}
  .lista-horarios li{
    display:flex;justify-content:space-between;gap:12px;
    padding:11px 12px;border-radius:10px;font-size:14.5px;font-weight:500;color:var(--texto-suave);
  }
  .lista-horarios li:nth-child(odd){background:#f6f8fd}
  .lista-horarios li b{font-weight:700;color:var(--texto)}
  .lista-horarios li.hoy{background:var(--azul);color:#fff}
  .lista-horarios li.hoy b{color:#fff}
  .nota-horarios{margin-top:12px;text-align:center;font-size:12.5px;color:#9aa0b8}

  a:focus-visible,button:focus-visible{outline:3px solid var(--azul);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<main class="pagina">
  <div class="portada" id="portada"></div>
  <div class="logo" id="logo"></div>

  <section class="contenido">
    <h1 id="nombre"></h1>
    <p class="mensaje" id="mensaje"></p>
    <div class="divisor">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9.3-9.4C1.5 7.6 3.6 4.5 6.8 4.5c2 0 3.5 1.1 5.2 3 1.7-1.9 3.2-3 5.2-3 3.2 0 5.3 3.1 4.1 6.6-1.8 4.8-9.3 9.4-9.3 9.4z"/></svg>
    </div>

    <a class="principal" id="principal" target="_blank" rel="noopener"></a>
    <div class="grilla" id="grilla"></div>

    <p class="pie"> <b></b></p>
  </section>
</main>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="tituloHorarios">
    <button class="cerrar" id="cerrar" aria-label="Cerrar">&times;</button>
    <h2 id="tituloHorarios"></h2>
    <ul class="lista-horarios" id="listaHorarios"></ul>
    <p class="nota-horarios" id="notaHorarios"></p>
  </div>
</div>

<script>
/* ============================================================
   CONFIGURACIÓN — EDITÁ SOLO ESTA PARTE
   ============================================================
   - Imágenes: pegá un link (https://...) o el nombre de un archivo
     que esté en la misma carpeta (ej: "logo.png").
   - Enlaces: pegá la URL en "url". Ejemplos:
       WhatsApp:  https://wa.me/5493510000000
       Instagram: https://instagram.com/tuusuario
       Mapa:      https://maps.app.goo.gl/xxxxx
       Llamar:    tel:+5493510000000
   - Para sacar un botón, borrá su línea completa.
   ============================================================ */
const CONFIG = {

  nombre:  "Tintoreria Palermo ",
  mensaje: "Tu opinión nos hace crecer<br>¡Gracias por ser parte!",

  // Imágenes
  imagenPortada: "https://i.postimg.cc/brWqpC09/Whats-App-Image-2026-11-04-at-23-08-51.jpg",
  imagenLogo:    "https://scontent.cdninstagram.com/v/t51.82787-19/686535366_17886494949521986_1665471627798339249_n.jpg?stp=dst-jpg_s150x150_tt6&_nc_cat=100&ig_cache_key=GMay6yhCOr4hrIs-ALFeaRaf8RwXbmNDAQAB1501500j-ccb7-5&ccb=7-5&_nc_sid=669407&efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLnd3dy4xMDc5LkMzIn0%3D&_nc_ohc=jeShDo4NkB0Q7kNvwGruDHJ&_nc_oc=AdpxmwmU0Ei-na60wowLP79HBOB0ch1YZo1cwgwT3SJ8eT5GgTTFEdYwc--AWWb3uno&_nc_zt=24&_nc_ht=scontent.cdninstagram.com&_nc_gid=nhLiuKYdS6dDvufM5a2X9A&_nc_ss=78689&oh=00_AQTgTabnBF4BZzqcvVofkDz_xw6dBd7s5iNuQ6jZky8q9w&oe=6AF25E71",   // ← pegá acá el logo (si queda vacío, se muestra el nombre corto)
  textoLogo:     "",

  // Botón grande azul
  botonPrincipal: { texto: "Dejar reseña en Google", url: "https://search.google.com/local/writereview?placeid=ChIJkyElVoGiMpQRx9Ayktc6kqE" },

  // Los botones (icono: whatsapp | instagram | reservar | ubicacion | horarios | telefono | web | promo)
  // Para sacar uno, borrá su línea completa.
  botones: [
    { texto: "WhatsApp",      icono: "whatsapp",  url: "https://wa.me/5493512482225" },
    { texto: "Instagram",     icono: "instagram", url: "https://www.instagram.com/tintoreriapalermo?utm_source=ig_web_button_share_sheet&xtok=ZDNlZDc0MzIxNw==" },
    { texto: "Cómo llegar",   icono: "ubicacion", url: "https://maps.app.goo.gl/nFgxZWwj3cdJ6EQSA" },
    { texto: "Horarios",      icono: "horarios",  ventana: "horarios" }   // abre la ventana de horarios (se edita abajo)
  ],

  // Ventana de horarios — editá los días y las horas a gusto.
  // Para un día cerrado escribí "Cerrado". Podés agregar o borrar líneas.
  horarios: {
    titulo: "Nuestros horarios",
    dias: [
      { dia: "Lunes",     horas: "9:00 – 17:00 " },
      { dia: "Martes",    horas: "9:00 – 17:00 " },
      { dia: "Miércoles", horas: "9:00 – 17:00 " },
      { dia: "Jueves",    horas: "9:00 – 17:00" },
      { dia: "Viernes",   horas: "9:00 – 17:00 " },
      { dia: "Sábado",    horas: "9:00 – 13:00 " },
      { dia: "Domingo",   horas: "Cerrado" }
    ],
    nota: "Feriados: consultá por WhatsApp"   // dejalo "" para no mostrar nada
  }
};
/* ============================================================
   FIN DE LA CONFIGURACIÓN — no hace falta tocar nada de acá abajo
   ============================================================ */

const ICONOS = {
  menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v7a2 2 0 0 0 2 2v9M10 3v7a2 2 0 0 1-2 2M8 3v6"/><path d="M16 21V3c-2 1.5-3 4-3 7 0 1.6.9 2.5 3 2.5"/><path d="M18 3v18" stroke="none"/></svg>',
  reservar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 10h18M8 2.5v4M16 2.5v4"/><path d="M8 14.5h2M14 14.5h2M8 17.5h2"/></svg>',
  ubicacion:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21.5s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9.5" r="2.6"/></svg>',
  horarios:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 6.5V12l3.5 2"/></svg>',
  telefono:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3.5h4l2 5-2.5 1.5a11 11 0 0 0 5 5l1.5-2.5 5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5.5a2 2 0 0 1 2-2z"/></svg>',
  web:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.8 4 6 4 9.5s-1.4 6.7-4 9.5c-2.6-2.8-4-6-4-9.5s1.4-6.7 4-9.5z"/></svg>',
  promo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12.5l-8 8a2 2 0 0 1-2.8 0L3 13.8V3h10.8l6.7 6.7a2 2 0 0 1 0 2.8z"/><circle cx="8" cy="8" r="1.4"/></svg>'
};

const GOOGLE_G = '<svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>';

const IG = '<svg viewBox="0 0 48 48"><defs><linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#fdc468"/><stop offset=".35" stop-color="#e1306c"/><stop offset=".7" stop-color="#c13584"/><stop offset="1" stop-color="#5851db"/></linearGradient></defs><rect width="48" height="48" rx="12" fill="url(#ig)"/><rect x="11" y="11" width="26" height="26" rx="8" fill="none" stroke="#fff" stroke-width="3"/><circle cx="24" cy="24" r="6.3" fill="none" stroke="#fff" stroke-width="3"/><circle cx="32" cy="16" r="1.9" fill="#fff"/></svg>';

const WA = '<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#25d366"/><path fill="#fff" transform="translate(8.4 8.4) scale(1.3)" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>';

ICONOS.instagram = IG;
ICONOS.whatsapp = WA;

const $ = id => document.getElementById(id);

// Imágenes
if (CONFIG.imagenPortada) $('portada').style.backgroundImage = `url("${CONFIG.imagenPortada}")`;
if (CONFIG.imagenLogo) $('logo').style.backgroundImage = `url("${CONFIG.imagenLogo}")`;
else $('logo').textContent = CONFIG.textoLogo;

// Textos
$('nombre').textContent = CONFIG.nombre;
$('mensaje').innerHTML = CONFIG.mensaje;
document.title = CONFIG.nombre;

// Botón principal
const p = $('principal');
p.href = CONFIG.botonPrincipal.url;
p.innerHTML = `<span class="ico">${GOOGLE_G}</span>${CONFIG.botonPrincipal.texto}`;

// Grilla
$('grilla').innerHTML = CONFIG.botones.map(b => b.ventana
  ? `<button type="button" class="tile" data-ventana="${b.ventana}">${ICONOS[b.icono] || ICONOS.web}<span>${b.texto}</span></button>`
  : `<a class="tile" href="${b.url}" target="_blank" rel="noopener">${ICONOS[b.icono] || ICONOS.web}<span>${b.texto}</span></a>`
).join('');

// Ventana de horarios
const H = CONFIG.horarios;
const hoy = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"][new Date().getDay()];
$('tituloHorarios').innerHTML = ICONOS.horarios + H.titulo;
$('listaHorarios').innerHTML = H.dias.map(d =>
  `<li class="${d.dia === hoy ? 'hoy' : ''}"><b>${d.dia}</b><span>${d.horas}</span></li>`
).join('');
$('notaHorarios').textContent = H.nota || '';

const overlay = $('overlay');
const abrir  = () => { overlay.classList.add('abierto'); overlay.setAttribute('aria-hidden','false'); };
const cerrar = () => { overlay.classList.remove('abierto'); overlay.setAttribute('aria-hidden','true'); };

document.querySelectorAll('[data-ventana="horarios"]').forEach(b => b.addEventListener('click', abrir));
$('cerrar').addEventListener('click', cerrar);
overlay.addEventListener('click', e => { if (e.target === overlay) cerrar(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrar(); });
</script>
</body>
</html>
